<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NoireRemote console</title>
<style nonce="__NONCE__">
:root{
--noire-bg:#141317;--noire-surface:#1c1b20;--noire-surface-raised:#232228;--noire-border:#33313a;
--noire-text:#e9e7ee;--noire-text-dim:#9c98a8;--noire-accent:#b48ead;--noire-accent-text:#141317;
--noire-accent-soft:#cdaec9;--noire-chip:#262430;--noire-code:#0f0e12;
--noire-ok:#8fbf7f;--noire-warn:#e0c07a;--noire-error:#d98a8a;
--noire-tok-key:#b48ead;--noire-tok-str:#8fbf7f;--noire-tok-num:#e0c07a;
--noire-tok-bool:#e0c07a;--noire-tok-null:#9c98a8;
--noire-radius:10px;--noire-font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--noire-font-mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--noire-font-size:15px;
--noire-gap:18px;--noire-page-width:1000px;--noire-sidebar-width:266px;--noire-dock-height:280px;
--dock-h:38px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--noire-bg);color:var(--noire-text);font-family:var(--noire-font);
font-size:var(--noire-font-size);line-height:1.55}
a{color:var(--noire-accent-soft);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;cursor:pointer}
.dim{color:var(--noire-text-dim)}
.mono{font-family:var(--noire-font-mono);font-size:.88em}
.grow{flex:1 1 auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hidden{display:none !important}

/* The gate, drawn in place of the shell when no session could be opened. */
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:380px;background:var(--noire-surface);border:1px solid var(--noire-border);
border-radius:calc(var(--noire-radius) + 2px);padding:26px 24px;display:flex;flex-direction:column;gap:12px}
.gate-card h1{font-size:1.25rem}
.gate-card p{margin:0;font-size:.88rem}
.gate-card input{width:100%}
.gate-error{color:var(--noire-error);min-height:1.2em;font-size:.85rem}

.shell{display:grid;grid-template-columns:var(--noire-sidebar-width) minmax(0,1fr);min-height:100vh}

/* The sidebar holds still and only its nav scrolls. The filter never leaves the screen. */
aside.side{border-right:1px solid var(--noire-border);background:var(--noire-surface);
position:sticky;top:0;align-self:start;height:100vh;height:100dvh;
display:flex;flex-direction:column;padding:16px 12px 0}
.side-top{flex:0 0 auto}
.side-title{display:flex;align-items:baseline;gap:8px;margin:0 4px 2px}
.side-title h1{font-size:1.05rem;overflow-wrap:anywhere}
.side-title .ver{font-size:.75rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin:0 4px 10px;font-size:.76rem;color:var(--noire-text-dim)}
.pill{border:1px solid var(--noire-border);border-radius:999px;padding:0 7px;color:var(--noire-text-dim)}
.pill.ok{color:var(--noire-ok);border-color:var(--noire-ok)}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin:0 4px 10px}
.btn{background:var(--noire-surface-raised);border:1px solid var(--noire-border);color:var(--noire-text);
padding:6px 11px;border-radius:calc(var(--noire-radius) - 3px);font-size:.8rem}
.btn:hover{border-color:var(--noire-accent)}
.btn.primary{background:var(--noire-accent);border-color:var(--noire-accent);
color:var(--noire-accent-text);font-weight:600}
input,select,textarea{font-family:inherit;font-size:.95em;color:var(--noire-text);
background:var(--noire-surface-raised);border:1px solid var(--noire-border);
border-radius:calc(var(--noire-radius) - 3px);padding:8px 10px}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--noire-accent)}
textarea{width:100%;min-height:90px;font-family:var(--noire-font-mono);resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--noire-accent);outline-offset:1px}
input.filter{width:calc(100% - 8px);margin:0 4px 10px;background:var(--noire-bg)}
nav.navlist{flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:calc(var(--dock-h) + 24px);
scrollbar-width:thin;scrollbar-color:var(--noire-border) transparent}
nav.navlist::-webkit-scrollbar{width:9px}
nav.navlist::-webkit-scrollbar-track{background:transparent}
nav.navlist::-webkit-scrollbar-thumb{background:var(--noire-border);border-radius:8px;
border:2px solid var(--noire-surface)}
nav.navlist::-webkit-scrollbar-thumb:hover{background:var(--noire-accent)}
.navtag{display:flex;align-items:center;gap:6px;font-size:.68rem;text-transform:uppercase;
letter-spacing:.08em;color:var(--noire-text-dim);margin:14px 6px 4px}
.navtag button{background:none;border:none;color:var(--noire-text-dim);font-size:.68rem;
text-transform:uppercase;letter-spacing:.08em;padding:0}
.navtag button:hover{color:var(--noire-accent)}
button.navlink{display:flex;gap:7px;align-items:center;width:100%;text-align:left;
padding:4px 7px;border:none;border-radius:calc(var(--noire-radius) - 4px);
background:none;color:var(--noire-text);font-size:.82rem}
button.navlink:hover{background:var(--noire-surface-raised)}
button.navlink.on{background:var(--noire-chip);color:var(--noire-accent-soft)}
button.navlink .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{min-width:0}
.topbar{display:none;align-items:center;gap:12px;padding:11px 18px;
border-bottom:1px solid var(--noire-border);background:var(--noire-surface);position:sticky;top:0;z-index:10}
/* Always visible, in both layouts: the topbar above it is only drawn on a narrow window, and a control nobody
   can see is a control that does nothing. */
.workbar{display:flex;align-items:center;gap:10px;padding:8px 18px;
border-bottom:1px solid var(--noire-border);background:var(--noire-surface);position:sticky;top:0;z-index:9}
.workbar select{background:var(--noire-surface-raised);border:1px solid var(--noire-border);
color:var(--noire-text);border-radius:5px;padding:3px 8px;font-size:.78rem}
.menu-btn{background:var(--noire-surface-raised);border:1px solid var(--noire-border);
color:var(--noire-text);border-radius:calc(var(--noire-radius) - 3px);padding:7px 11px;font-size:.85rem}
.content{max-width:var(--noire-page-width);margin:0 auto;
padding:calc(var(--noire-gap) + 4px) 30px calc(var(--dock-h) + 24px)}

.group{margin:26px 0}
.group>.group-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
border-bottom:1px solid var(--noire-border);padding-bottom:8px}
.group>.group-head h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;
color:var(--noire-text-dim)}
.group>p.summary{margin:8px 0 0;font-size:.88rem;color:var(--noire-text-dim)}
.group>p.declared{margin:8px 0 0}

details.op{border:1px solid var(--noire-border);border-radius:calc(var(--noire-radius) - 1px);
margin:10px 0;background:var(--noire-surface);overflow:hidden;scroll-margin-top:16px}
details.op[open]{border-color:var(--noire-accent)}
details.op>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;
align-items:center;gap:10px;flex-wrap:wrap}
details.op>summary::-webkit-details-marker{display:none}
.op .access{font-weight:700;font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;
padding:3px 8px;border-radius:5px;color:var(--noire-accent-text);min-width:60px;text-align:center}
.op .access.local{background:var(--noire-text-dim)}
.op .access.remote{background:var(--noire-ok)}
.op .nm{font-family:var(--noire-font-mono);font-size:.92rem}
.op .op-sum{color:var(--noire-text-dim);margin-left:auto;font-size:.82rem;text-align:right}
.op .body{padding:4px 16px 16px;border-top:1px solid var(--noire-border)}
.tag{font-size:.65rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;
border:1px solid var(--noire-border);color:var(--noire-text-dim)}
.tag.warn{color:var(--noire-warn);border-color:var(--noire-warn)}
.tag.error{color:var(--noire-error);border-color:var(--noire-error)}
.tag.ok{color:var(--noire-ok);border-color:var(--noire-ok)}

.tabs{border:1px solid var(--noire-border);border-radius:calc(var(--noire-radius) - 2px);
overflow:hidden;margin:10px 0 0}
.tabbar{display:flex;gap:2px;background:var(--noire-bg);border-bottom:1px solid var(--noire-border);
overflow-x:auto}
.tab{background:transparent;border:0;color:var(--noire-text-dim);padding:7px 14px;font-size:.72rem;
text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--noire-text);border-bottom-color:var(--noire-accent)}
.tabpane{display:none;padding:12px 14px}
.tabpane.on{display:block}

.field{margin-top:12px}
.field>label{display:block;font-weight:600;margin-bottom:4px;font-size:.9rem}
.field .help{color:var(--noire-text-dim);font-size:.82em;margin-bottom:6px}
fieldset{border:1px solid var(--noire-border);border-radius:calc(var(--noire-radius) - 3px);
margin:0;padding:10px 12px}
legend{padding:0 6px;color:var(--noire-text-dim);font-size:.82em}
.vector{display:flex;gap:8px}
.vector label{display:flex;flex-direction:column;gap:2px;font-size:.78em;
color:var(--noire-text-dim);flex:1 1 0}
.list-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.list-row>*:first-child{flex:1 1 auto}
.small{background:var(--noire-surface-raised);border:1px solid var(--noire-border);
color:var(--noire-text);border-radius:calc(var(--noire-radius) - 4px);padding:4px 9px;font-size:.78rem}
.small:hover{border-color:var(--noire-accent)}

.codewrap{position:relative;margin:0}
pre{background:var(--noire-code);border:1px solid var(--noire-border);
border-radius:calc(var(--noire-radius) - 2px);padding:13px 15px;overflow:auto;max-height:340px;
font-family:var(--noire-font-mono);font-size:.82rem;margin:0;white-space:pre;
padding-right:78px;scrollbar-gutter:stable}
.copy{position:absolute;top:8px;right:20px;z-index:2;background:var(--noire-surface-raised);
border:1px solid var(--noire-border);color:var(--noire-text-dim);border-radius:5px;
padding:3px 9px;font-size:.68rem}
.copy:hover{color:var(--noire-text);border-color:var(--noire-accent)}
.tree{font-family:var(--noire-font-mono);font-size:.82rem;background:var(--noire-code);
border:1px solid var(--noire-border);border-radius:calc(var(--noire-radius) - 2px);
padding:10px 12px;overflow:auto;max-height:340px}
.tree ul{list-style:none;margin:0;padding-left:16px}
.tree .key{color:var(--noire-tok-key)}
.tree .num{color:var(--noire-tok-num)}
.tree .str{color:var(--noire-tok-str)}
.tree .bool{color:var(--noire-tok-bool)}
.tree .nul{color:var(--noire-tok-null)}

/* The same five colours a code block uses. An example and an answer read alike wherever they are shown. */
pre.code .key{color:var(--noire-tok-key)}
pre.code .str{color:var(--noire-tok-str)}
pre.code .num{color:var(--noire-tok-num)}
pre.code .bool{color:var(--noire-tok-bool)}
pre.code .nul{color:var(--noire-tok-null)}
pre.code .punc{color:var(--noire-text-dim)}
.tree.plain{white-space:pre;display:block}

/* The schema view: one row per field, its type on the right, expandable when it has a shape of its own. */
.frow{padding:6px 0;border-bottom:1px solid var(--noire-border)}
.frow:last-child{border-bottom:0}
.fhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fname{font-family:var(--noire-font-mono)}
.ftype{color:var(--noire-accent);font-family:var(--noire-font-mono);font-size:.78rem;margin-left:auto}
.ftype.t-string{color:var(--noire-tok-str)}
.ftype.t-number{color:var(--noire-tok-num)}
.ftype.t-boolean{color:var(--noire-tok-bool)}
.ftype.t-any{color:var(--noire-tok-null)}
.fname{color:var(--noire-tok-key)}
.freq{color:var(--noire-danger,#d08770)}
.freq{color:var(--noire-text-dim);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em}
.expand{background:var(--noire-surface-raised);border:1px solid var(--noire-border);
color:var(--noire-text-dim);border-radius:5px;padding:2px 8px;font-size:.66rem}
.expand:hover{color:var(--noire-text);border-color:var(--noire-accent)}
.nested{margin:6px 0 2px 14px;padding-left:12px;border-left:2px solid var(--noire-border)}
.viewmode{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--noire-text-dim)}

/* A socket card's frame log. Reads like a terminal, direction first. */
.sock-state{font-family:var(--noire-font-mono);font-size:.72rem;color:var(--noire-text-dim);
background:var(--noire-chip);border-radius:999px;padding:2px 9px}
.sock-state.on{color:var(--noire-tok-str)}
.socket-log{margin:0 10px;background:var(--noire-code);border:1px solid var(--noire-border);
border-radius:calc(var(--noire-radius) - 2px);max-height:46vh;overflow:auto;padding:6px 8px}
.sock-line{display:flex;gap:8px;align-items:flex-start;padding:3px 0;
border-bottom:1px solid var(--noire-border);font-family:var(--noire-font-mono);font-size:.78rem}
.sock-line:last-child{border-bottom:0}
.sock-at{color:var(--noire-text-dim);white-space:nowrap}
.sock-arrow{width:1em;text-align:center}
.sock-line.in .sock-arrow{color:var(--noire-tok-str)}
.sock-line.out .sock-arrow{color:var(--noire-tok-key)}
.sock-line.note{color:var(--noire-text-dim)}
.sock-text{white-space:pre-wrap;word-break:break-word;flex:1}
.sock-copy{background:none;border:0;color:var(--noire-text-dim);font-size:.66rem;opacity:0;padding:0 4px}
.sock-line:hover .sock-copy{opacity:1}
.sock-copy:hover{color:var(--noire-text)}

/* The traffic feed: one line per thing the listener served, with the wire first. */
.line.traffic{display:flex;gap:8px;align-items:baseline}
.wire{font-family:var(--noire-font-mono);font-size:.66rem;text-transform:uppercase;
background:var(--noire-chip);border-radius:4px;padding:1px 5px;min-width:2.2em;text-align:center}
.wire.ws{color:var(--noire-tok-key)}
.wire.http{color:var(--noire-tok-num)}
.tr-name{font-family:var(--noire-font-mono);font-size:.78rem}
.tr-ok{color:var(--noire-tok-str);font-size:.72rem}
.tr-bad{color:var(--noire-error);font-size:.72rem}

/* The view switch between the API surface and the sockets, each a full page. */
.views{display:flex;gap:2px;background:var(--noire-chip);border-radius:7px;padding:2px}
.views .view{background:none;border:0;color:var(--noire-text-dim);font-size:.8rem;padding:4px 10px;
border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.views .view.on{background:var(--noire-surface-raised);color:var(--noire-text)}

/* One card per published socket, drawn once and patched in place. A typed message survives every update. */
.sock-card{border:1px solid var(--noire-border);border-radius:calc(var(--noire-radius) - 1px);
background:var(--noire-surface);margin:16px 0;overflow:hidden;scroll-margin-top:60px}
.sock-card.flash{box-shadow:0 0 0 1px var(--noire-accent)}
.sock-card .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;
border-bottom:1px solid var(--noire-border)}
.sock-card .head .nm{font-family:var(--noire-font-mono);font-weight:600;font-size:.95rem}
.sock-card .head .route{font-family:var(--noire-font-mono);font-size:.74rem;color:var(--noire-text-dim)}
.sock-card .stats{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;font-family:var(--noire-font-mono);
font-size:.74rem;color:var(--noire-text-dim);border-bottom:1px solid var(--noire-border)}
.sock-card .stats b{color:var(--noire-text);font-weight:600}
.sock-card .part{padding:12px 16px;border-bottom:1px solid var(--noire-border)}
.sock-card .part:last-child{border-bottom:0}
.sock-card .part h3{margin:0 0 8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;
color:var(--noire-text-dim);font-weight:600}
.sock-card .line-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sock-card .line-form input{flex:1 1 240px;min-width:160px}
.sock-card table{width:100%;border-collapse:collapse;font-size:.78rem}
.sock-card th{text-align:left;color:var(--noire-text-dim);font-weight:500;padding:4px 8px;
border-bottom:1px solid var(--noire-border);white-space:nowrap}
.sock-card td{padding:6px 8px;border-bottom:1px solid var(--noire-border);vertical-align:middle}
.sock-card tr:last-child td{border-bottom:0}
.sock-card td.mono{font-family:var(--noire-font-mono)}
.sock-card tr.inline td{background:var(--noire-surface-raised)}
.room-chip{display:inline-flex;align-items:center;gap:5px;background:var(--noire-chip);border:1px solid transparent;
border-radius:999px;padding:2px 9px;font-size:.72rem;font-family:var(--noire-font-mono);margin:0 4px 4px 0;
cursor:pointer;color:var(--noire-text)}
.room-chip.on{border-color:var(--noire-accent)}
.room-chip .n{color:var(--noire-text-dim)}
.empty-line{color:var(--noire-text-dim);font-size:.82rem}
.sock-card .part .line-form + .line-form{margin-top:8px}
.card-log{margin:10px 0 0;height:200px;min-height:80px;max-height:none;resize:vertical;overflow:auto}
.sock-line.push .sock-arrow{color:var(--noire-tok-num)}

/* The dock reports its own height into --dock-h. The content reserves that height. */
.dock{position:fixed;right:0;bottom:0;left:0;z-index:20;background:var(--noire-surface);
border-top:1px solid var(--noire-border);display:flex;flex-direction:column;
height:var(--noire-dock-height);max-height:80vh}
.dock.collapsed{height:auto}
.dock .grip{display:flex;align-items:center;gap:8px;padding:0 10px;flex:0 0 auto;
min-height:38px;touch-action:none}
.dock:not(.collapsed) .grip{cursor:ns-resize}
.dock .grip .tabs{border:0;border-radius:0;margin:0;display:flex;gap:2px;overflow-x:auto;
scrollbar-width:none}
.dock .grip .tabs::-webkit-scrollbar{display:none}
.dock .grip .tabs button{border:none;background:none;border-radius:calc(var(--noire-radius) - 4px);
padding:5px 10px;color:var(--noire-text-dim);font-size:.78rem;display:flex;align-items:center;
gap:6px;white-space:nowrap}
.dock .grip .tabs button.on{background:var(--noire-surface-raised);color:var(--noire-text)}
.count{background:var(--noire-chip);border-radius:999px;padding:0 6px;font-size:.66rem;
font-family:var(--noire-font-mono);color:var(--noire-text-dim)}
.chev{background:none;border:none;color:var(--noire-text-dim);padding:4px 8px;font-size:.9rem;
line-height:1}
.chev:hover{color:var(--noire-accent)}
.dock-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
border-top:1px solid var(--noire-border)}
.dock.collapsed .dock-body{display:none}
.pane{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 14px;display:none}
.pane.on{display:block}
.line{font-family:var(--noire-font-mono);font-size:.78rem;white-space:pre-wrap;
word-break:break-word;padding:1px 0}
.line.error{color:var(--noire-error)}
.line.warning{color:var(--noire-warn)}
.line.debug{color:var(--noire-text-dim)}
.entry{border-bottom:1px solid var(--noire-border);padding:8px 0}
.entry:last-child{border-bottom:none}
canvas{display:block;width:100%;height:150px;background:var(--noire-code);
border:1px solid var(--noire-border);border-radius:calc(var(--noire-radius) - 2px)}
#qr{margin:0 4px 10px}
#qr canvas{width:170px;height:170px;image-rendering:pixelated;background:#fff}
#qr .mono{word-break:break-all;font-size:.68rem;margin-top:6px}

/* The fleet: which listeners the page calls and shows, chosen here and remembered per browser. */
.fleet-box{position:relative}
.fleet-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:300px;max-width:86vw;
background:var(--noire-surface-raised);border:1px solid var(--noire-border);
border-radius:calc(var(--noire-radius) - 2px);padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.fleet-menu .row{justify-content:space-between;padding:2px 6px 8px;font-size:.78rem}
.fleet-menu label{display:flex;align-items:center;gap:8px;padding:6px;font-size:.82rem;border-radius:5px;cursor:pointer}
.fleet-menu label:hover{background:var(--noire-chip)}
.fleet-menu label.locked{color:var(--noire-text-dim);cursor:default}
.cover{font-family:var(--noire-font-mono);font-size:.68rem;color:var(--noire-text-dim);
background:var(--noire-chip);border-radius:999px;padding:1px 8px;white-space:nowrap}
.cover.part{color:var(--noire-warn)}
.who{font-family:var(--noire-font-mono);font-size:.74rem;color:var(--noire-text-dim);margin:12px 0 4px}
.who:first-child{margin-top:0}
.who.bad{color:var(--noire-error)}
.sources{display:flex;gap:2px;margin-left:10px;overflow-x:auto;scrollbar-width:none}
.sources button{border:none;background:none;border-radius:5px;padding:3px 8px;color:var(--noire-text-dim);
font-size:.7rem;white-space:nowrap}
.sources button.on{background:var(--noire-chip);color:var(--noire-text)}
.src{font-family:var(--noire-font-mono);font-size:.7rem;color:var(--noire-accent-soft);margin-right:8px;white-space:nowrap}

/* Dalamud Logs: the host's log, one line per entry, like Dalamud's own log window. */
.logbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.logbar input[type=search]{flex:1 1 180px;min-width:140px}
.logbar select,.logbar input[type=search]{background:var(--noire-surface-raised);border:1px solid var(--noire-border);
color:var(--noire-text);border-radius:5px;padding:5px 9px;font-size:.8rem}
.logbar .small.on{border-color:var(--noire-accent);color:var(--noire-accent-soft)}
.log-tabs{margin:0 0 8px}
.loglist{background:var(--noire-code);border:1px solid var(--noire-border);border-radius:calc(var(--noire-radius) - 2px);
height:calc(100vh - 210px - var(--dock-h));min-height:260px;overflow:auto;padding:4px 0;
font-family:var(--noire-font-mono);font-size:.76rem}
.logline{display:flex;gap:10px;padding:1px 10px;align-items:baseline}
.logline .at{color:var(--noire-text-dim);white-space:nowrap}
.logline .lv{flex:none;width:2.4em;font-weight:600}
.logline .from{color:var(--noire-accent-soft);white-space:nowrap}
.logline .msg{flex:1;white-space:pre-wrap;word-break:break-word}
.loglist:not(.multi) .logline .src{display:none}
.logline.verbose .lv,.logline.debug .lv,.logline.verbose .msg,.logline.debug .msg{color:var(--noire-text-dim)}
.logline.information .lv{color:var(--noire-tok-str)}
.logline.warning .lv,.logline.warning .msg{color:var(--noire-warn)}
.logline.error .lv,.logline.error .msg,.logline.fatal .lv,.logline.fatal .msg{color:var(--noire-error)}
.logline.marked{box-shadow:inset 3px 0 0 var(--noire-accent);background:rgba(180,142,173,.08)}
.loglist.copying .logline{cursor:pointer;user-select:none}
.loglist.copying .logline:hover{background:var(--noire-chip)}
.logline.sel,.loglist.copying .logline.sel{background:var(--noire-surface-raised);box-shadow:inset 3px 0 0 var(--noire-tok-num)}
.logline mark{background:var(--noire-warn);color:var(--noire-code);border-radius:2px;padding:0 1px}
.logempty{padding:10px 12px;color:var(--noire-text-dim)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside.side{position:fixed;z-index:40;top:0;left:0;width:284px;max-width:86vw;
    height:100vh;height:100dvh;transform:translateX(-100%);transition:transform .2s ease;
    box-shadow:0 0 40px rgba(0,0,0,.5)}
  aside.side.open{transform:translateX(0)}
  .topbar{display:flex}
  .content{padding:20px 14px calc(var(--dock-h) + 24px)}
  .op .body{padding:4px 12px 14px}
  details.op>summary{gap:8px 10px}
  .op .op-sum{margin-left:0;width:100%;text-align:left}
  .vector{flex-wrap:wrap}
  #stream-state{display:none}
  .workbar{flex-wrap:wrap;row-gap:8px;padding:8px 14px}
  .views .view,#fleet-toggle,.workbar .viewmode{white-space:nowrap}
  .fleet-box{position:static}
  .fleet-menu{left:14px;right:14px;min-width:0}
  .sources{max-width:45%}
  .cover{white-space:normal}
  .loglist{height:60vh}
}

<style nonce="__NONCE__" id="plugin-style"></style>
</head>
<body>
<div class="gate hidden" id="gate">
  <form class="gate-card" id="gate-form">
    <h1 id="gate-title">NoireRemote console</h1>
    <p class="dim" id="gate-note">The plugin's window shows the key this console asks for.</p>
    <input id="gate-key" type="password" placeholder="Console key" autocomplete="current-password"/>
    <button class="btn primary" type="submit">Open</button>
    <p class="gate-error" id="gate-error"></p>
  </form>
</div>
<div class="shell hidden" id="shell">
  <aside class="side" id="side">
    <div class="side-top">
      <div class="side-title"><h1 id="title">NoireRemote</h1><span class="ver dim" id="meta-version"></span></div>
      <div class="meta">
        <span id="meta-plugin"></span>
        <span id="meta-instance" class="mono"></span>
        <span id="meta-revision"></span>
        <span class="pill" id="meta-access"></span>
      </div>
      <div class="actions">
        <button class="btn" id="reload">Reload</button>
        <button class="btn" id="openapi">OpenAPI</button>
        <button class="btn" id="python">Python</button>
        <button class="btn hidden" id="show-qr">Phone</button>
        <button class="btn" id="signout">Sign out</button>
      </div>
      <div id="qr" class="hidden"></div>
      <input class="filter" id="filter" type="search" placeholder="Filter members" autocomplete="off"/>
    </div>
    <nav class="navlist" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu">Menu</button>
      <strong id="topbar-title">NoireRemote</strong>
    </div>
    <div class="workbar">
      <div class="views" id="views" role="tablist">
        <button class="view on" data-view="apis" role="tab">APIs<span class="count" id="count-apis">0</span></button>
        <button class="view" data-view="sockets" role="tab">Sockets<span class="count" id="count-socketview">0</span></button>
        <button class="view hidden" data-view="logs" role="tab" id="view-logs">Dalamud Logs<span class="count" id="count-logs">0</span></button>
      </div>
      <div class="fleet-box hidden" id="fleet-box">
        <button class="small" id="fleet-toggle" title="Which listeners this page calls and shows">Fleet</button>
        <div class="fleet-menu hidden" id="fleet-menu"></div>
      </div>
      <span class="grow"></span>
      <label class="viewmode" title="How an answer is shown, here and in the history">
        <input type="checkbox" id="view-json"> returns as JSON
      </label>
    </div>
    <main class="content" id="surface"></main>
    <main class="content hidden" id="sockets-view"></main>
    <main class="content hidden" id="logs-view"></main>
  </div>
</div>
<div class="dock collapsed hidden" id="dock">
  <div class="grip" id="grip">
    <div class="tabs">
      <button data-pane="events" class="on">Events<span class="count" id="count-events">0</span></button>
      <button data-pane="traffic">Traffic<span class="count" id="count-traffic">0</span></button>
      <button data-pane="metrics">Metrics<span class="count" id="count-metrics">0</span></button>
      <button data-pane="history">History<span class="count" id="count-history">0</span></button>
    </div>
    <div class="sources hidden" id="sources"></div>
    <span class="grow"></span>
    <span id="stream-state" class="dim mono"></span>
    <button class="chev" id="chev" title="Expand or collapse">&#9650;</button>
  </div>
  <div class="dock-body">
    <div class="pane on" id="pane-events"></div>
    <div class="pane" id="pane-traffic"></div>
    <div class="pane" id="pane-metrics"><canvas id="chart"></canvas><div id="metric-names" class="dim mono"></div></div>
    <div class="pane" id="pane-history"></div>
  </div>
</div>
<script nonce="__NONCE__">
"use strict";
(function () {
  var boot = null, session = null, pinned = load("noire.pinned", []), lastValues = load("noire.values", {});
  var liveForms = {}, defsIndex = {};
  var fleet = { hosts: [], selected: load("noire.fleet", []), manifests: {}, generation: 0 };
  var source = load("noire.source", "");
  var calls = [], metrics = {}, reader = null;
  var live = { socket: null, cursors: {}, attempt: 0, upgrades: 0, onStream: false, timer: null, generation: 0 };
  var dock = load("noire.dock", { height: 280, collapsed: true, pane: "events" });

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function pick(id) { return document.getElementById(id); }
  function load(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* a private window refuses */ }
  }

  function grant() {
    var hash = location.hash || "";
    var mark = hash.indexOf("g=");
    return mark < 0 ? null : decodeURIComponent(hash.substring(mark + 2));
  }

  function api(path, options) {
    options = options || {};
    var headers = options.headers || {};
    if (session) headers["Authorization"] = "Noire-Console " + session;
    headers["Content-Type"] = "application/json";
    return fetch(path, { method: options.method || "GET", headers: headers, body: options.body, cache: "no-store" });
  }

  function openSession(body) {
    return fetch("/noire/console/session", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {})
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (answer) {
      if (!answer || !answer.token) return false;
      session = answer.token;
      save("noire.token", session);
      return true;
    }).catch(function () { return false; });
  }

  function clearFragment() {
    try { history.replaceState(null, "", location.pathname); } catch (e) { location.hash = ""; }
  }

  // A stored token, then a grant in the fragment, then a bare request, then the gate.
  function start() {
    var g = grant();

    if (g) clearFragment();

    return holds(load("noire.token", null))
      .then(function (ok) { return ok || !g ? ok : openSession({ grant: g }); })
      .then(function (ok) { return ok ? ok : openSession({}); })
      .then(function (ok) { return ok ? bootstrap() : gate(null); })
      .catch(function (error) { gate(String(error)); });
  }

  function holds(token) {
    if (!token) return Promise.resolve(false);

    session = token;

    return api("/noire/console/bootstrap")
      .then(function (r) { if (r.ok) return true; session = null; return false; })
      .catch(function () { session = null; return false; });
  }

  function gate(message) {
    session = null;
    pick("shell").classList.add("hidden");
    pick("dock").classList.add("hidden");
    pick("gate").classList.remove("hidden");
    pick("gate-error").textContent = message || "";
    pick("gate-key").focus();
  }

  function redrawSurface() {
    var open = [...document.querySelectorAll("details.op")].filter(function (card) { return card.open; })
      .map(function (card) { return card.id; });
    var scrolled = pick("surface").scrollTop;

    Object.keys(liveForms).forEach(function (id) {
      try {
        var form = liveForms[id];
        var held = form.read();
        if (held && Object.keys(held).length > 0) lastValues[form.route] = held;
      } catch (e) { /* a card that has gone away reads nothing */ }
    });

    liveForms = {};
    render();

    open.forEach(function (id) {
      var card = document.getElementById(id);
      if (card) card.open = true;
    });

    pick("surface").scrollTop = scrolled;
  }

  function resurface(change, from) {
    if (from && from !== selfId()) {
      delete fleet.manifests[from];
      if (group().some(function (host) { return host.instance === from; })) refreshGroup();

      return;
    }

    if (change && boot.manifest && change.revision === boot.manifest.revision) return;

    manifestOf("").then(function (answer) {
      if (!answer) return;

      boot.manifest = answer;
      redrawSurface();
      applyLogScope();
      surfaceNote(change);
    }).catch(function () { /* the live channel reports a listener going away */ });
  }

  // Another listener's manifest is read through this host. The page cannot sign a request to it.
  function manifestOf(instance) {
    var url = !instance
      ? "/noire/v1/_manifest"
      : "/noire/console/fleet/_manifest?instance=" + encodeURIComponent(instance);

    return api(url).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (answer) { return answer ? (answer.result || answer) : null; });
  }

  function hostName(host) {
    var name = (host.plugin || "a listener") + " #" + String(host.instance || "").split("-")[0];

    return host.label ? name + " · " + host.label : name;
  }

  function surfaceNote(change) {
    if (!change) return;

    dockLine("pane-events", el("div", "line", new Date().toISOString() + "  what this listener publishes changed: "
      + (change.endpoints || 0) + " api(s), " + (change.sockets || 0) + " socket(s)"));
    bump();
  }

  function bootstrap() {
    return api("/noire/console/bootstrap").then(function (r) {
      if (!r.ok) throw new Error("no session");
      return r.json();
    }).then(function (answer) {
      boot = answer;
      pick("gate").classList.add("hidden");
      pick("shell").classList.remove("hidden");
      pick("dock").classList.remove("hidden");
      applyBoot();
      render();
      showView(view);
      applyDock();
      openLive();
    });
  }

  var appliedVariables = [];

  function applyBoot() {
    var root = document.documentElement;
    var variables = boot.variables || {};

    appliedVariables.forEach(function (name) {
      if (!Object.prototype.hasOwnProperty.call(variables, name)) root.style.removeProperty("--noire-" + name);
    });
    appliedVariables = Object.keys(variables);
    appliedVariables.forEach(function (name) { root.style.setProperty("--noire-" + name, variables[name]); });

    pick("plugin-style").textContent = boot.styleSheet || "";

    var title = boot.title || "NoireRemote console";

    document.title = title;
    pick("title").textContent = title;
    pick("gate-title").textContent = title;
    pick("topbar-title").textContent = title;

    var access = pick("meta-access");

    access.textContent = boot.isLoopback ? "loopback" : "network";
    access.classList.toggle("ok", !!boot.isLoopback);

    var phone = !!(boot.showQrCode && boot.remoteUrl);

    pick("show-qr").classList.toggle("hidden", !phone);

    if (!phone) pick("qr").classList.add("hidden");
    else if (!pick("qr").classList.contains("hidden")) drawQr(boot.remoteUrl);

    applyLogScope();
    loadFleet();
  }

  function refreshBoot() {
    return api("/noire/console/bootstrap").then(function (r) { return r.ok ? r.json() : null; }).then(function (answer) {
      if (!answer) return;

      var channelsBefore = channelNames().join(",");

      boot = answer;
      applyBoot();

      if (channelNames().join(",") !== channelsBefore && live.socket && live.socket.readyState === 1)
        sendCommand({ op: "subscribe", subscription: { channels: channelNames(), cursors: live.cursors } });

      resurface(null);

      note("the plugin changed a setting");
    }).catch(function () { /* the live channel reports a listener going away */ });
  }

  function note(text) {
    dockLine("pane-events", el("div", "line dim", new Date().toISOString() + "  " + text));
    bump();
  }

  function invalidated(scope) {
    if (scope === "settings") return refreshBoot();
    if (scope === "fleet") return loadFleet();
    if (scope === "sockets") return loadSocketState();
  }

  function render() {
    var manifest = boot.manifest || { endpoints: [] };
    pick("meta-version").textContent = manifest.pluginVersion || "";
    pick("meta-plugin").textContent = manifest.plugin || "";
    pick("meta-instance").textContent = manifest.instance || "";
    var revision = pick("meta-revision");
    revision.textContent = "surface " + (manifest.revision || 0);
    revision.title = "How many times this listener's published surface has changed since it started. "
      + "A cache token.";

    indexDefs();

    var endpoints = surfaceModel();

    count("socketview", manifestSockets().length);
    count("apis", endpoints.length);

    var surface = pick("surface"), nav = pick("nav");
    clear(surface);
    clear(nav);

    if (endpoints.length === 0) {
      surface.appendChild(el("p", "dim", "Nothing is published on " + (isFleet() ? "these listeners." : "this listener.")));
    }

    endpoints.forEach(function (endpoint) {
      surface.appendChild(renderEndpoint(endpoint));
      nav.appendChild(renderNav(endpoint));
    });

    if (view === "sockets") drawSocketNav();
    if (view === "logs") drawLogNav();
  }

  // One entry per member and contract. A member whose contract differs gets its own card.
  function surfaceModel() {
    var byName = {}, list = [];

    group().forEach(function (host) {
      var manifest = manifestFor(host.instance);

      if (!manifest) return;

      (manifest.endpoints || []).forEach(function (endpoint) {
        var entry = byName[endpoint.name];

        if (!entry) {
          entry = byName[endpoint.name] = {
            name: endpoint.name, summary: endpoint.summary, access: endpoint.access, events: endpoint.events,
            entries: [], byKey: {}
          };
          list.push(entry);
        }

        (endpoint.members || []).forEach(function (member) {
          var key = member.name + "@" + (member.contract || host.instance);
          var one = entry.byKey[key];

          if (!one) {
            one = entry.byKey[key] = { key: key, member: member, listeners: [] };
            entry.entries.push(one);
          }

          one.listeners.push(host.instance);
        });
      });
    });

    list.sort(function (a, b) { return order(a.name) - order(b.name) || a.name.localeCompare(b.name); });

    return list;
  }

  function indexDefs() {
    defsIndex = {};

    group().forEach(function (host) {
      var defs = (manifestFor(host.instance) || {}).$defs || {};

      Object.keys(defs).forEach(function (name) { defsIndex[name] = defs[name]; });
    });
  }

  function order(name) { var at = pinned.indexOf(name); return at < 0 ? 1000 : at; }

  function cardId(endpoint, entry) {
    var tail = entry.member.contract || String(entry.listeners[0] || "");

    return "m-" + endpoint.name + "-" + entry.member.name + "-" + tail.split("-")[0].substring(0, 8);
  }

  function members(endpoint) {
    return endpoint.entries.slice().sort(function (x, y) {
      var a = x.member, b = y.member;

      return (a.order || 0) - (b.order || 0)
        || String(a.group || "").localeCompare(String(b.group || ""))
        || a.name.localeCompare(b.name)
        || y.listeners.length - x.listeners.length;
    });
  }

  function coverage(entry) {
    var total = group().length;

    if (total < 2) return null;

    var reach = entry.listeners.length;
    var names = entry.listeners.map(shortName).join(", ");
    var badge = el("span", "cover" + (reach < total ? " part" : ""), reach + "/" + total + (reach < total ? " · " + names : ""));

    badge.title = "Served by " + names;

    return badge;
  }

  function renderNav(endpoint) {
    var box = el("div", "navsection");
    var head = el("div", "navtag");
    head.appendChild(el("span", "grow", endpoint.name));
    var pin = el("button", null, pinned.indexOf(endpoint.name) < 0 ? "pin" : "unpin");
    pin.addEventListener("click", function () { togglePin(endpoint.name); });
    head.appendChild(pin);
    box.appendChild(head);

    members(endpoint).forEach(function (entry) {
      var member = entry.member;
      var link = el("button", "navlink");
      link.appendChild(el("span", "nm grow", member.name));
      if (member.mode === "job") link.appendChild(el("span", "tag", "job"));
      if (member.deprecated) link.appendChild(el("span", "tag warn", "dep"));
      if (entry.listeners.length < group().length) link.appendChild(el("span", "tag", entry.listeners.length + "/" + group().length));
      link.dataset.search = (endpoint.name + " " + member.name + " " + (member.summary || "")).toLowerCase();
      link.addEventListener("click", function () { reveal(cardId(endpoint, entry), link); });
      box.appendChild(link);
    });

    return box;
  }

  function reveal(id, link) {
    var card = pick(id);
    if (!card) return;
    card.open = true;
    card.scrollIntoView({ block: "start", behavior: "smooth" });
    Array.prototype.forEach.call(document.querySelectorAll("button.navlink"), function (other) {
      other.classList.toggle("on", other === link);
    });
    pick("side").classList.remove("open");
  }

  function togglePin(name) {
    var at = pinned.indexOf(name);
    if (at < 0) pinned.unshift(name); else pinned.splice(at, 1);
    save("noire.pinned", pinned);
    render();
  }

  function renderEndpoint(endpoint) {
    var group = el("section", "group");
    var head = el("div", "group-head");
    head.appendChild(el("h2", "grow", endpoint.name));
    if (endpoint.access === "remote") head.appendChild(el("span", "tag ok", "remote"));
    var pin = el("button", "small", pinned.indexOf(endpoint.name) < 0 ? "Pin" : "Unpin");
    pin.addEventListener("click", function () { togglePin(endpoint.name); });
    head.appendChild(pin);
    group.appendChild(head);

    if (endpoint.summary) group.appendChild(el("p", "summary", endpoint.summary));

    members(endpoint).forEach(function (entry) { group.appendChild(renderMember(endpoint, entry)); });

    (endpoint.events || []).forEach(function (declared) {
      group.appendChild(el("p", "declared dim mono",
        "event " + declared.name + " publishes " + declared.topic + " on " + declared.channel));
    });

    return group;
  }

  function renderMember(endpoint, entry) {
    var member = entry.member;
    var reach = entry.listeners.length;
    var card = el("details", "op");
    card.id = cardId(endpoint, entry);
    card.dataset.search = (endpoint.name + " " + member.name + " " + (member.summary || "")).toLowerCase();

    var head = el("summary");
    head.appendChild(el("span", "access " + (member.access === "remote" ? "remote" : "local"),
      member.access === "remote" ? "remote" : "local"));
    head.appendChild(el("span", "nm", member.name));
    if (member.group) head.appendChild(el("span", "tag", member.group));
    if (member.mode === "job") head.appendChild(el("span", "tag", "job"));
    if (member.readOnly) head.appendChild(el("span", "tag", "reads"));
    if (member.transports && member.transports.length === 1) head.appendChild(el("span", "tag", member.transports[0]));
    if (member.deprecated) head.appendChild(el("span", "tag warn", "deprecated"));
    if (member.confirm) head.appendChild(el("span", "tag error", "confirm"));
    if (member.progress) head.appendChild(el("span", "tag", "progress"));
    var cover = coverage(entry);
    if (cover) head.appendChild(cover);
    if (member.summary) head.appendChild(el("span", "op-sum", member.summary));
    card.appendChild(head);

    var body = el("div", "body");
    var inputs = [];
    var call = el("div");

    (member.parameters || []).forEach(function (parameter) {
      var control = buildField(endpoint, member, parameter);
      inputs.push(control);
      call.appendChild(control.node);
    });

    var actions = el("div", "row");
    actions.style.marginTop = "14px";
    var label = (member.readOnly ? "Read" : "Call") + (reach > 1 ? " " + reach + " listeners" : "");
    var button = el("button", "btn primary", label);
    var armed = false;
    actions.appendChild(button);
    var status = el("span", "dim mono", "");
    actions.appendChild(status);
    call.appendChild(actions);

    var output = el("div");
    output.style.marginTop = "10px";
    call.appendChild(output);

    button.addEventListener("click", function () {
      if (member.confirm && !armed) {
        armed = true;
        button.textContent = reach > 1 ? "Confirm on " + reach + " listeners" : "Confirm";
        setTimeout(function () {
          if (!armed) return;
          armed = false;
          button.textContent = label;
        }, 4000);
        return;
      }
      armed = false;
      button.textContent = label;
      run(endpoint, entry, collect(inputs), status, output);
    });

    var host = document.createDocumentFragment();

      if (match.index > at) host.appendChild(document.createTextNode(text.slice(at, match.index)));

        host.appendChild(el("span", "key", match[1]));

      read: function () {

        Object.keys(fields).forEach(function (key) {
          var v = fields[key].read();
          if (v !== undefined) { value[key] = v; any = true; }
        });
        return any ? value : undefined;
      }
    };
  }

  // A card only this listener serves calls its own route. Any other goes through the fleet route with the card's contract.
  function run(endpoint, entry, args, status, output) {
    var member = entry.member;
    var route = endpoint.name + "/" + member.name;
    if (boot.rememberValues) { lastValues[route] = args; save("noire.values", lastValues); }

    status.textContent = "calling";
    clear(output);
    var started = performance.now();
    var direct = entry.listeners.length === 1 && entry.listeners[0] === selfId();
    var call = {
      endpoint: endpoint.name, member: member.name, route: route, args: args,
      listeners: entry.listeners.slice(), contract: member.contract, direct: direct
    };

    send(call)
      .then(function (answer) {
        var took = Math.round(performance.now() - started);
        status.textContent = outcomeLine(answer, took);
        drawOutcome(output, answer);
        remember(Object.assign({}, call, { answer: answer, took: took }));
      })
      .catch(function (error) {
        status.textContent = "failed";
        show(output, { error: String(error) });
      });
  }

  function send(call) {
    var path = call.direct
      ? boot.apiBaseUrl + call.route
      : "/noire/console/fleet/" + encodeURIComponent(call.endpoint) + "/" + encodeURIComponent(call.member);
    var body = call.direct
      ? { args: call.args, protocol: 1 }
      : { instances: call.listeners, contract: call.contract, args: call.args };

    return api(path, { method: "POST", body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (body) { return { status: r.status, body: body }; }); });
  }

  function outcomeLine(answer, took) {
    var body = answer.body || {};

    if (!body.outcomes) return answer.status + " in " + took + " ms";

    return (body.answered || 0) + " of " + (body.total || body.outcomes.length) + " answered in " + took + " ms";
  }

  function drawOutcome(output, answer) {
    var body = answer.body;

    clear(output);

    if (!body || !body.outcomes) { show(output, body); return; }

    body.outcomes.forEach(function (outcome) {
      var box = el("div");

      output.appendChild(el("div", "who" + (outcome.ok ? "" : " bad"),
        shortName(outcome.instance) + (outcome.ok ? "  " + (outcome.elapsedMs || 0) + " ms" : "  failed")));
      show(box, outcome.ok ? outcome.result : (outcome.error || { error: "no answer" }));
      output.appendChild(box);
    });
  }

  var shownAnswers = new Set();

  function show(output, body) {
    output.noireAnswer = body;
    shownAnswers.add(output);
    drawAnswer(output, body);
  }

  function redrawAnswers() {
    shownAnswers.forEach(function (output) {
      if (!output.isConnected) { shownAnswers.delete(output); return; }

      drawAnswer(output, output.noireAnswer);
    });
  }

  function drawAnswer(output, body) {
    clear(output);

    var text = JSON.stringify(body, null, 2);
    var wrap = el("div", "codewrap");
    var button = el("button", "copy", "Copy");

    button.addEventListener("click", function () { copied(button, text); });

    // Past this size an answer is shown as text. A tree costs too many DOM nodes.
    if (answersAsJson() || text.length > 65536) {
      wrap.appendChild(codeBlock(text));
      wrap.appendChild(button);
      output.appendChild(wrap);
      return;
    }

    var tree = el("div", "tree");
    tree.appendChild(node(body));
    wrap.appendChild(tree);
    wrap.appendChild(button);
    output.appendChild(wrap);
  }

  function answersAsJson() { return load("noire.answersAsJson", true) === true; }

  function node(value) {
    if (value === null || value === undefined) return el("span", "nul", "null");
    if (typeof value === "number") return el("span", "num", value);
    if (typeof value === "boolean") return el("span", "bool", value);
    if (typeof value === "string") return el("span", "str", JSON.stringify(value));
    var list = el("ul");
    if (Array.isArray(value)) {
      value.forEach(function (item, index) {
        var line = el("li");
        line.appendChild(el("span", "key", index + ": "));
        line.appendChild(node(item));
        list.appendChild(line);
      });
      return list;
    }
    Object.keys(value).forEach(function (key) {
      var line = el("li");
      line.appendChild(el("span", "key", key + ": "));
      line.appendChild(node(value[key]));
      list.appendChild(line);
    });
    return list;
  }

  function remember(call) {
    call.at = new Date().toISOString();
    calls.unshift(call);
    if (calls.length > 100) calls.pop();
    drawHistory();
  }

  function drawHistory() {
    var pane = document.getElementById("pane-history");
    clear(pane);
    calls.forEach(function (entry) {
      var box = el("div", "entry");
      var head = el("div", "row");
      box.dataset.source = entry.listeners.join(",");
      head.appendChild(el("strong", null, entry.route));
      if (isFleet() || entry.listeners.length > 1) head.appendChild(el("span", "src", entry.listeners.map(shortName).join(", ")));
      head.appendChild(el("span", "dim mono", outcomeLine(entry.answer, entry.took) + "  " + entry.at));
      var replay = el("button", "small", "Replay");
      replay.addEventListener("click", function () {
        var started = performance.now();
        send(entry).then(function (answer) {
          remember(Object.assign({}, entry, { answer: answer, took: Math.round(performance.now() - started) }));
        });
      });
      head.appendChild(replay);
      box.appendChild(head);
      box.appendChild(el("div", "line", JSON.stringify(entry.args)));

      var answer = el("div");
      drawOutcome(answer, entry.answer);
      box.appendChild(answer);
      box.classList.toggle("hidden", !shownFrom(box.dataset.source));
      pane.appendChild(box);
    });
    bump();
  }

  function snippet(kind, endpoint, member, args) {
    var url = location.origin + boot.apiBaseUrl + endpoint.name + "/" + member.name;
    var body = JSON.stringify({ args: args, protocol: 1 });
    var auth = boot.token ? boot.token : "<the listener's credential>";
    if (kind === "curl") {
      return "curl -X POST " + url + " \\\n  -H 'Content-Type: application/json' \\\n  -H 'Authorization: Bearer "
        + auth + "' \\\n  -d '" + body.replace(/'/g, "'\\''") + "'";
    }
    if (kind === "python") {
      return "import json, urllib.request\n\nrequest = urllib.request.Request(\n    \"" + url + "\",\n    data=json.dumps("
        + body + ").encode(),\n    headers={\"Content-Type\": \"application/json\", \"Authorization\": \"Bearer " + auth
        + "\"},\n    method=\"POST\",\n)\nwith urllib.request.urlopen(request) as response:\n    print(response.read().decode())";
    }
    return "using NoireLib.Remote;\n\nvar result = await NoireRemoteClient.Endpoint(\"" + endpoint.name + "\")\n    .CallAsync<object>(\""
      + member.name + "\", " + (Object.keys(args).length ? anonymous(args) : "null") + ");";
  }

  // JSON.stringify's output would not compile after `new`.
  function anonymous(value) {
    if (value === null || value === undefined) return "null";
    if (typeof value === "boolean") return value ? "true" : "false";
    if (typeof value === "number") return String(value) + (Number.isInteger(value) ? "" : "f");
    if (typeof value === "string") return JSON.stringify(value);
    if (Array.isArray(value)) return "new[] { " + value.map(anonymous).join(", ") + " }";

    return "new { " + Object.keys(value).map(function (key) {
      return key + " = " + anonymous(value[key]);
    }).join(", ") + " }";
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return; }
    var box = el("textarea");
    box.value = text;
    document.body.appendChild(box);
    box.select();
    try { document.execCommand("copy"); } catch (e) { /* ignore */ }
    document.body.removeChild(box);
  }

  function openLive() {
    closeLive();

    if (!session) { liveState("closed"); return; }

    if (live.onStream) openStream(live.generation); else openSocket(live.generation);
  }

  // An answer arriving after the page moved on is tested against the generation.
  function closeLive() {
    live.generation += 1;

    if (live.timer) { clearTimeout(live.timer); live.timer = null; }
    if (live.socket) { try { live.socket.close(); } catch (e) { /* already gone */ } live.socket = null; }
    if (reader) { try { reader.cancel(); } catch (e) { /* already gone */ } reader = null; }
  }

  function liveState(text) {
    var state = pick("stream-state");
    if (state) state.textContent = text;
  }

  function channelNames() { return (boot.channels || []).map(function (c) { return c.name; }); }

  // Jitter keeps two tabs from retrying in lockstep.
  function retryDelay() {
    var policy = (boot && boot.reconnect) || { initialDelayMs: 1000, multiplier: 2, maxDelayMs: 30000, jitter: 0.25 };
    var delay = policy.initialDelayMs;

    for (var i = 0; i < live.attempt; i++) {
      delay *= policy.multiplier;
      if (delay >= policy.maxDelayMs) break;
    }

    delay = Math.min(delay, policy.maxDelayMs);

    if (policy.jitter > 0) delay *= 1 - policy.jitter + 2 * policy.jitter * Math.random();

    return Math.max(0, Math.round(delay));
  }

  function retryLive(generation) {
    if (generation !== live.generation || live.timer) return;

    var delay = retryDelay();
    live.attempt += 1;
    liveState("closed, retrying in " + Math.max(1, Math.round(delay / 1000)) + " s");
    live.timer = setTimeout(function () { live.timer = null; openLive(); }, delay);
  }

  function openSocket(generation) {
    var url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + (boot.livePath || "/noire/console/live");
    var socket = null, opened = false;

    liveState("connecting");

    // The session token travels as the second protocol offer. A page's handshake carries nothing else.
    try {
      socket = new WebSocket(url, [boot.liveProtocol || "noire-console", session]);
    } catch (e) {
      upgradeFailed(generation);
      return;
    }

    live.socket = socket;

    socket.onopen = function () {
      if (generation !== live.generation) { socket.close(); return; }
      opened = true;
      live.attempt = 0;
      live.upgrades = 0;
      forgetRelays();
      liveState("live on the socket");
      sendCommand({ op: "subscribe", subscription: { channels: channelNames(), cursors: live.cursors } });
      watchFleet();
    };

    socket.onmessage = function (message) {
      if (generation !== live.generation || typeof message.data !== "string") return;

      var frame = null;
      try { frame = JSON.parse(message.data); } catch (e) { return; }
      receiveFrame(frame);
    };

    socket.onclose = function () {
      if (generation !== live.generation) return;
      live.socket = null;
      if (opened) retryLive(generation); else upgradeFailed(generation);
    };
  }

  function sendCommand(command) {
    if (live.socket && live.socket.readyState === 1) live.socket.send(JSON.stringify(command));
  }

  function upgradeFailed(generation) {
    live.socket = null;
    live.upgrades += 1;
    if (live.upgrades >= 2) live.onStream = true;
    retryLive(generation);
  }

  function openStream(generation) {
    liveState("connecting");

    api("/noire/v1/_stream", { method: "POST", body: JSON.stringify({ channels: channelNames(), cursors: live.cursors }) })
      .then(function (response) {
        if (generation !== live.generation) return;
        if (!response.ok || !response.body) { retryLive(generation); return; }

        live.attempt = 0;
        liveState("live on the stream");
        reader = response.body.getReader();

        var decoder = new TextDecoder(), buffer = "";
        function pump() {
          return reader.read().then(function (chunk) {
            if (generation !== live.generation) return;
            if (chunk.done) { reader = null; retryLive(generation); return; }
            buffer += decoder.decode(chunk.value, { stream: true });
            var lines = buffer.split("\n");
            buffer = lines.pop();
            lines.forEach(function (line) {
              if (line.indexOf("data:") !== 0) return;
              try { receive(JSON.parse(line.slice(5).trim())); } catch (e) { /* a keep-alive or a partial line */ }
            });
            return pump();
          });
        }
        return pump();
      }).catch(function () {
        if (generation === live.generation) retryLive(generation);
      });
  }

  function receiveFrame(frame) {
    if (!frame || !frame.op) return;

    if (frame.op === "invalidate") return invalidated(frame.scope);

    if (frame.op === "socket.state") return socketState(frame.socket, frame.state);
    if (frame.op === "socket.message") return socketMessage(frame.socket, frame.text);

    if (frame.op === "fleet.events") {
      if (!frame.source || !group().some(function (host) { return host.instance === frame.source; })) return;

      (frame.events || []).forEach(function (event) { receive(event, frame.source); });
      return;
    }

    if (frame.op === "events") {
      if (frame.cursors) Object.keys(frame.cursors).forEach(function (name) { live.cursors[name] = frame.cursors[name]; });
      if (frame.missed) missed(frame.missedChannels);
      (frame.events || []).forEach(receive);
      return;
    }

    if (frame.op === "error" && frame.error) liveState("refused: " + frame.error.message);
  }

  function missed(channels) {
    var names = (channels || []).join(", ") || "a channel";
    dockLine("pane-events", el("div", "line warning", "events were dropped from " + names + " before the page read them"));
    bump();
  }

  function receive(event, from) {
    if (!event) return;
    if (event.missed) return from ? undefined : missed(event.channels);
    if (!event.topic) return;

    if (event.topic === "_instance.surface") return resurface(event.data, from);
    if (event.topic === "_instance.metadata") return;
    if (!from && event.seq && event.channel) live.cursors[event.channel] = event.seq;
    if (event.channel === "log") return receiveLog(event.data, from);
    if (event.channel === "metrics") return receiveMetric(event, from);
    if (event.channel === "traffic") return receiveTraffic(event, from);
    dockLine("pane-events", el("div", "line", event.atUtc + "  " + event.topic + "  " + JSON.stringify(event.data)), from);
    bump();
  }

  function dockLine(paneId, line, from) {
    var pane = pick(paneId);
    var id = from || selfId();

    line.dataset.source = id;
    if (isFleet()) line.insertBefore(el("span", "src", shortName(id)), line.firstChild);
    line.classList.toggle("hidden", !shownFrom(id));
    pane.insertBefore(line, pane.firstChild);

    while (pane.childNodes.length > 400) pane.removeChild(pane.lastChild);
  }

  function receiveTraffic(event, from) {
    var data = event.data || {};
    var row = el("div", "line traffic");
    var at = (event.atUtc || new Date().toISOString()).substring(11, 23);

    row.appendChild(el("span", "sock-at", at));

    if (event.topic === "traffic.call") {
      row.appendChild(el("span", "wire " + (data.wire || ""), data.wire || ""));
      row.appendChild(el("span", "tr-name", (data.endpoint ? data.endpoint + "/" : "") + (data.member || "")));
      row.appendChild(el("span", data.ok ? "tr-ok" : "tr-bad", data.ok ? "ok" : (data.errorCode || "failed")));
      row.appendChild(el("span", "dim mono", Math.round(data.elapsedMs || 0) + " ms"));
    } else if (event.topic === "traffic.socket") {
      row.appendChild(el("span", "wire ws", "ws"));
      row.appendChild(el("span", "tr-name", data.socket || ""));
      row.appendChild(el("span", data.state === "open" ? "tr-ok" : "dim mono",
        data.state + (data.code ? " " + data.code : "") + (data.reason ? " " + data.reason : "")));
      row.appendChild(el("span", "dim mono", data.address || ""));
    } else {
      row.appendChild(el("span", "wire ws", data.direction === "in" ? "←" : "→"));
      row.appendChild(el("span", "tr-name", data.socket || ""));
      row.appendChild(el("span", "sock-text", data.preview == null ? data.bytes + " bytes" : data.preview));
    }

    dockLine("pane-traffic", row, from);
    count("traffic", pick("pane-traffic").childNodes.length);
    bump();
  }

  function receiveMetric(event, from) {
    var id = from || selfId();
    var samples = metrics[id] || (metrics[id] = []);
    samples.push(event.data || {});
    if (samples.length > 240) samples.shift();
    drawChart();
    bump();
  }

  function drawChart() {
    var canvas = document.getElementById("chart");
    var width = canvas.clientWidth, height = canvas.clientHeight;
    if (width < 2 || height < 2) return;
    canvas.width = width; canvas.height = height;
    var context = canvas.getContext("2d");
    if (!context) return;
    context.clearRect(0, 0, width, height);
    var ids = Object.keys(metrics).filter(function (id) { return shownFrom(id) && metrics[id].length > 1; });
    var series = [];
    ids.forEach(function (id) {
      var samples = metrics[id];
      Object.keys(samples[samples.length - 1]).forEach(function (name) { series.push({ id: id, name: name, samples: samples }); });
    });
    series = series.slice(0, 4);
    var style = getComputedStyle(document.documentElement);
    var palette = [style.getPropertyValue("--noire-accent"), style.getPropertyValue("--noire-ok"),
      style.getPropertyValue("--noire-warn"), style.getPropertyValue("--noire-error")];
    series.forEach(function (one, index) {
      var values = one.samples.map(function (s) { return Number(s[one.name]) || 0; });
      var top = Math.max.apply(null, values) || 1;
      context.beginPath();
      context.strokeStyle = (palette[index] || "#888").trim();
      context.lineWidth = 1.5;
      values.forEach(function (value, at) {
        var x = at / (values.length - 1) * width;
        var y = height - (value / top) * (height - 8) - 4;
        if (at === 0) context.moveTo(x, y); else context.lineTo(x, y);
      });
      context.stroke();
    });
    var legend = document.getElementById("metric-names");
    clear(legend);
    legend.appendChild(el("span", null, series.map(function (one) {
      return (ids.length > 1 ? shortName(one.id) + " " : "") + one.name;
    }).join("  ")));
  }

  function drawQr(text) {
    var box = document.getElementById("qr");
    clear(box);
    box.classList.remove("hidden");
    var canvas = el("canvas");
    var size = qrEncode(text, canvas);
    box.appendChild(canvas);
    var link = el("div", "mono dim", text);
    box.appendChild(link);
    var copyButton = el("button", "small", "Copy link");
    copyButton.addEventListener("click", function () { copy(text); });
    box.appendChild(copyButton);
    return size;
  }

  // Byte-mode QR code, error correction level M, versions one to ten, fixed mask. Enough for a network address plus a grant.
  var QR_BLOCKS = {
    1: [10, 1, 16, 0, 0], 2: [16, 1, 28, 0, 0], 3: [26, 1, 44, 0, 0], 4: [18, 2, 32, 0, 0], 5: [24, 2, 43, 0, 0],
    6: [16, 4, 27, 0, 0], 7: [18, 4, 31, 0, 0], 8: [22, 2, 38, 2, 39], 9: [22, 3, 36, 2, 37], 10: [26, 4, 43, 1, 44]
  };
  var QR_ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34],
    7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50]

        next[j + 1] ^= gfMultiply(poly[j], QR_EXP[i]);

      poly = next;

    return poly;

    var generator = rsGenerator(degree);
    var remainder = new Array(degree).fill(0);
    for (var i = 0; i < data.length; i++) {

      remainder.push(0);
      for (var j = 0; j < generator.length - 1; j++) remainder[j] ^= gfMultiply(generator[j + 1], factor);

    var codewords = [];
    for (var at = 0; at < bits.length; at += 8) codewords.push(parseInt(bits.substring(at, at + 8), 2));

    var blocks = [], eccs = [], cursor = 0;
    for (var g = 0; g < group1; g++) { blocks.push(codewords.slice(cursor, cursor + data1)); cursor += data1; }
    for (var h = 0; h < group2; h++) { blocks.push(codewords.slice(cursor, cursor + data2)); cursor += data2; }
    blocks.forEach(function (block) { eccs.push(rsRemainder(block, ecPerBlock)); });
